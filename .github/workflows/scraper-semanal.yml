name: Scraper Semanal Biotrén

on:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: Production
    
    steps:
      - name: 📣 Notificar inicio del workflow
        run: |
          FECHA_CHILE=$(TZ='America/Santiago' date +'%Y-%m-%d')
          HORA_CHILE=$(TZ='America/Santiago' date +'%H:%M:%S')
          TIMESTAMP_ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Guardar timestamp Unix para calcular duración real al final
          echo "INICIO_TS=$(date +%s)" >> $GITHUB_ENV

          curl -s -o /dev/null -H "Content-Type: application/json" \
            -d "{
              \"username\": \"Biotrén Bot\",
              \"embeds\": [{
                \"title\": \"🚂 Iniciando Scraper Semanal Biotrén\",
                \"description\": \"El workflow ha comenzado a ejecutarse correctamente.\",
                \"color\": 3066993,
                \"fields\": [
                  {
                    \"name\": \"📅 Fecha\",
                    \"value\": \"$FECHA_CHILE\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"🕐 Hora de inicio\",
                    \"value\": \"$HORA_CHILE (Santiago)\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"🔗 Ver ejecución\",
                    \"value\": \"[Abrir en GitHub](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\",
                    \"inline\": false
                  }
                ],
                \"footer\": {
                  \"text\": \"GitHub Actions • Scraper Semanal\"
                },
                \"timestamp\": \"$TIMESTAMP_ISO\"
              }]
            }" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: 📥 Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'          # LTS hasta abril 2027 — actualizar a 24 en ~oct 2026
      
      - name: 🕐 Mostrar hora actual en Chile
        run: |
          echo "Hora UTC: $(date -u)"
          echo "Hora Chile: $(TZ='America/Santiago' date)"
      
      - name: 📦 Instalar dependencias
        working-directory: ./efe
        run: npm install
      
      - name: 🚂 Ejecutar scraper
        id: scraper
        working-directory: ./efe
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ: America/Santiago
        run: node index.js
        # Sin continue-on-error: si el scraper falla de verdad, el workflow falla
      
      - name: 📋 Verificar archivo generado
        run: |
          if [ -f horarios.json ]; then
            echo "✅ horarios.json generado correctamente"
            echo "📊 Tamaño: $(du -h horarios.json | cut -f1)"
            echo "📝 Primeras líneas:"
            head -20 horarios.json
          else
            echo "❌ ERROR: horarios.json no fue generado"
            exit 1
          fi
      
      - name: 💾 Commit y push de resultados
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"

          # Guardar cambios temporalmente para poder hacer pull limpio
          git stash --include-untracked || true
          git pull --rebase origin main || git pull --rebase origin master || true
          git stash pop || true

          git add horarios.json version.json
          if git diff --staged --quiet; then
            echo "Sin cambios en horarios.json ni version.json"
          else
            git commit -m "🤖 Actualización automática horarios - $(TZ='America/Santiago' date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
      
      - name: 🎉 Notificar éxito del workflow
        if: success()
        run: |
          FIN_TS=$(date +%s)
          DURACION_SEG=$(( FIN_TS - INICIO_TS ))
          DURACION_MIN=$(( DURACION_SEG / 60 ))
          DURACION_SEG_RESTO=$(( DURACION_SEG % 60 ))
          HORA_FIN=$(TZ='America/Santiago' date +'%H:%M:%S')
          TIMESTAMP_ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          curl -s -o /dev/null -H "Content-Type: application/json" \
            -d "{
              \"username\": \"Biotrén Bot\",
              \"embeds\": [{
                \"title\": \"✅ Scraper completado exitosamente\",
                \"color\": 3066993,
                \"fields\": [
                  {
                    \"name\": \"🕐 Hora de término\",
                    \"value\": \"$HORA_FIN (Santiago)\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"⏱️ Duración real\",
                    \"value\": \"${DURACION_MIN}m ${DURACION_SEG_RESTO}s\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"🔗 Ver ejecución\",
                    \"value\": \"[Abrir en GitHub](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\",
                    \"inline\": false
                  }
                ],
                \"footer\": {
                  \"text\": \"GitHub Actions • Scraper Semanal\"
                },
                \"timestamp\": \"$TIMESTAMP_ISO\"
              }]
            }" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: 📢 Notificar fallo de workflow
        if: failure()
        run: |
          FECHA_CHILE=$(TZ='America/Santiago' date +'%Y-%m-%d %H:%M:%S')
          curl -s -o /dev/null -H "Content-Type: application/json" \
            -d "{
              \"username\": \"Biotrén Bot\",
              \"embeds\": [{
                \"title\": \"❌ Fallo total del workflow\",
                \"description\": \"El workflow de GitHub Actions falló.\n\n⏰ Hora: $FECHA_CHILE\n🔗 Ver logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                \"color\": 15158332,
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

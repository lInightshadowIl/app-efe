<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0e14">
    <title>Biotren App - Horarios</title>
    <meta name="description" content="Consulta los horarios del Biotren offline.">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
       <!-- Apple Touch Icons -->
    <link rel="icon" href="icons/icon-32x32.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="144x144" href="icons/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120x120.png">
    <link rel="apple-touch-icon" sizes="114x114" href="icons/icon-114x114.png">
    <link rel="apple-touch-icon" sizes="76x76" href="icons/icon-76x76.png">
    <link rel="apple-touch-icon" sizes="72x72" href="icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="60x60" href="icons/icon-60x60.png">
    <link rel="apple-touch-icon" sizes="57x57" href="icons/icon-57x57.png">
    <link rel="apple-touch-icon" href="https://www.efe.cl/wp-content/themes/efe/assets/img/logo-efe.png">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🚉 Biotren Horarios</h1>
            <p id="fecha-actual"></p>
        </header>

        <div id="aviso-feriado" class="hidden"></div>
        <div id="aviso-feriados-semana" class="hidden"></div>

        <!-- RUTAS FAVORITAS -->
        <section class="favoritos-section" id="favoritos-section">
            <div class="favoritos-header">
                <div class="favoritos-titulo">
                    ⭐ Mis Rutas <span class="fav-badge" id="fav-badge" style="display:none">0</span>
                </div>
                <button class="btn-nueva-ruta" id="btn-nueva-ruta">
                    + Nueva ruta
                </button>
            </div>
            <div class="favoritos-lista" id="favoritos-lista">
                <div class="favoritos-vacio" id="favoritos-vacio">
                    <span>⭐</span>
                    Agrega rutas favoritas para consultar horarios con un solo toque.
                </div>
            </div>
        </section>

        <div class="seccion-divisor">
            <span>Búsqueda manual</span>
        </div>

        <section class="selector-group">
            <label>¿Cuándo viajas?</label>
            <select id="dia-select">
                <option value="hoy">Hoy (Tiempo Real)</option>
                <option value="laboral">Lunes a Viernes</option>
                <option value="sabado">Sábado</option>
                <option value="festivo">Domingo o Feriado</option>
            </select>

            <div class="estaciones-container">
                <label>Origen:</label>
                <select id="origen-select"></select>

                <button id="btn-swap" type="button" class="swap-button">
                    🔄 Intercambiar Estaciones
                </button>

                <label>Destino:</label>
                <select id="destino-select"></select>
            </div>

            <div class="filtro-tiempo">
                <label class="switch">
                    <input type="checkbox" id="ver-todo">
                    <span class="slider"></span>
                </label>
                <span>Mostrar horarios pasados</span>
            </div>

            <button id="buscar-btn">Consultar Horarios</button>
        </section>

        <section id="resultados-container">
            <p class="no-data">Selecciona tu ruta para ver los próximos trenes.</p>
        </section>
    </div>
    
    <!-- Modal Crear / Editar Ruta Favorita -->
    <div class="modal-overlay" id="modal-favorito" data-modo="crear">
        <div class="modal-box">
            <div class="modal-titulo">⭐ <span id="modal-titulo-txt">Nueva Ruta Favorita</span></div>

            <div class="modal-campo">
                <label>Nombre de la ruta</label>
                <input type="text" id="fav-nombre" placeholder="Ej: Trabajo, Casa, Universidad…" maxlength="30">
            </div>
            <div class="modal-campo">
                <label>Origen</label>
                <select id="fav-origen"></select>
            </div>
            <div class="modal-campo">
                <label>Destino</label>
                <select id="fav-destino"></select>
            </div>

            <div class="modal-botones">
                <button class="btn-modal-cancelar" id="btn-modal-cancelar">Cancelar</button>
                <button class="btn-modal-guardar"  id="btn-modal-guardar">⭐ Guardar ruta</button>
            </div>
        </div>
    </div>

    <script src="estaciones.js"></script>
    <script src="app.js"></script>

    <!-- Registro del Service Worker mejorado -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
                .then(registration => {
                    // 1. Mantenemos tu verificación cada hora
                    setInterval(() => {
                        registration.update();
                    }, 60 * 60 * 1000);
                    
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // 2. Aquí es donde eliminamos cualquier mensaje o pregunta
                                console.log('✨ Versión lista. Aplicando automáticamente...');
                                
                                // Mandamos la orden directa de saltar la espera
                                newWorker.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                })
                .catch(error => {
                    console.error('❌ Error al registrar Service Worker:', error);
                });
        });
        
        // 3. Este bloque es vital: cuando el nuevo SW toma el mando, recarga la app
        let refreshing = false; // Evita bucles de recarga
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
                console.log('🔄 App actualizada. Recargando para mostrar cambios...');
                window.location.reload();
                refreshing = true;
            }
        });
    } else {
        console.warn('⚠️ Service Workers no soportados');
    }
</script>
</body>

</html>

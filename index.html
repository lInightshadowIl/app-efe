<!--
    CSS CRÍTICO INLINE
    Se aplica en el primer frame, antes de que el navegador descargue style.css.
    Evita el flash negro/blanco al abrir la app con internet lento u offline.
    Solo contiene lo mínimo: fondo, color de texto y una transición suave.
    El resto del diseño sigue en style.css sin cambios.
-->
<style>
    html, body {
        margin: 0;
        padding: 0;
        background-color: #0b0e14; /* igual a theme-color */
        color: #e0e0e0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100vh;
    }
    /* Evita el destello de contenido sin estilo en el primer render */
    .app-container {
        opacity: 0;
        animation: fadeIn 0.2s ease forwards;
    }
    @keyframes fadeIn {
        to { opacity: 1; }
    }
</style>

<!--
    REGISTRO DEL SERVICE WORKER
    
    Cambios respecto a la versión anterior:
    
    1. Se eliminó el bloque 'controllerchange' que forzaba window.location.reload()
       automáticamente. Ese reload era la pantalla blanca: el SW nuevo tomaba control
       y la app se recargaba sin avisar al usuario.
    
       Con la nueva estrategia staleWhileRevalidate en sw.js, el HTML/JS/CSS se
       actualiza en background y la nueva versión queda lista para la PRÓXIMA visita.
       No hace falta recargar en medio de la sesión del usuario.
    
    2. Cuando hay una versión nueva lista (newWorker.state === 'installed'), se muestra
       un banner no intrusivo. El usuario decide cuándo recargar.
    
    3. La verificación periódica cada hora se mantiene igual.
-->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
                .then(registration => {

                    // Verifica actualizaciones cada hora
                    setInterval(() => {
                        registration.update();
                    }, 60 * 60 * 1000);

                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;

                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // SW nuevo listo → recargar automáticamente
                                console.log('✨ Nueva versión disponible, recargando...');
                                window.location.reload();
                            }
                        });
                    });

                })
                .catch(error => {
                    console.error('❌ Error al registrar Service Worker:', error);
                });
        });

    } else {
        console.warn('⚠️ Service Workers no soportados');
    }


</script>

<script>
(function () {
    var modal = document.getElementById('modal-favorito');
    if (!modal) return;

    var scrollPosition = 0;
    // Detección de iOS (iPhone, iPad, iPod y Safari en Mac con pantalla táctil)
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    function fitOverlayIOS() {
        if (window.visualViewport) {
            var vv = window.visualViewport;
            var overSize = 3000; 
            modal.style.position = 'fixed';
            modal.style.top      = '-' + overSize + 'px';
            modal.style.left     = '0px';
            modal.style.width    = '100%';
            modal.style.height   = (window.innerHeight + overSize * 2) + 'px';
            
            var paddingTop = overSize + vv.offsetTop;
            var paddingBottom = Math.max(0, (window.innerHeight + overSize) - (vv.offsetTop + vv.height));
            
            modal.style.paddingTop = paddingTop + 'px';
            modal.style.paddingBottom = paddingBottom + 'px';
        } else {
            var h = window.innerHeight;
            modal.style.position = 'fixed';
            modal.style.height   = h + 'px';
            modal.style.top      = '0px';
            modal.style.bottom   = 'auto';
            modal.style.paddingTop = '0px';
            modal.style.paddingBottom = '0px';
        }
    }

    function resetOverlay() {
        modal.style.position = '';
        modal.style.height   = '';
        modal.style.top      = '';
        modal.style.left     = '';
        modal.style.width    = '';
        modal.style.bottom   = '';
        modal.style.paddingTop = '';
        modal.style.paddingBottom = '';
    }

    function blockScroll(e) {
        var box = modal.querySelector('.modal-box');
        if (box && box.contains(e.target)) {
            if (box.scrollHeight > box.clientHeight) {
                return; // Permitir scroll interno en el modal
            }
        }
        e.preventDefault();
    }

    var observer = new MutationObserver(function () {
        if (modal.classList.contains('visible')) {
            if (isIOS) {
                // Lógica exclusiva para iOS: Giant Overlay + Body Fixed
                scrollPosition = window.pageYOffset || document.documentElement.scrollTop;
                document.body.style.position = 'fixed';
                document.body.style.top = '-' + scrollPosition + 'px';
                document.body.style.width = '100%';
                document.body.style.overflow = 'hidden';

                fitOverlayIOS();
                
                if (window.visualViewport) {
                    window.visualViewport.addEventListener('resize', fitOverlayIOS);
                    window.visualViewport.addEventListener('scroll', fitOverlayIOS);
                } else {
                    window.addEventListener('resize', fitOverlayIOS);
                }
            } else {
                // Lógica para Android: Chrome gestiona el teclado redimensionando el layout nativamente.
                // Solo bloqueamos el scroll del body para evitar que el fondo se mueva.
                document.body.style.overflow = 'hidden';
            }
            modal.addEventListener('touchmove', blockScroll, { passive: false });
        } else {
            if (isIOS) {
                document.body.style.position = '';
                document.body.style.top = '';
                document.body.style.width = '';
                document.body.style.overflow = '';
                window.scrollTo(0, scrollPosition);

                resetOverlay();
                
                if (window.visualViewport) {
                    window.visualViewport.removeEventListener('resize', fitOverlayIOS);
                    window.visualViewport.removeEventListener('scroll', fitOverlayIOS);
                } else {
                    window.removeEventListener('resize', fitOverlayIOS);
                }
            } else {
                // Restaurar Android
                document.body.style.overflow = '';
                resetOverlay();
            }
            modal.removeEventListener('touchmove', blockScroll);
        }
    });

    observer.observe(modal, { attributes: true, attributeFilter: ['class'] });
})();
</script>
